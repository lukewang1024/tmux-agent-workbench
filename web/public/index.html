<!doctype html>
<html lang="{{language}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#f8faff">
  <title>Workbench Web</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-192.png">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/vendor/xterm.css">
  <script src="/vendor/passkeys.js" defer></script>
  <script src="/vendor/xterm.js" defer></script>
  <script src="/vendor/fit.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="icon-agents" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="14" rx="3"/><path d="M8 9.5h.01m4 0h.01m4 0h.01M8 14h8"/></symbol>
    <symbol id="icon-machines" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01m4-10h6m-6 10h6"/></symbol>
    <symbol id="icon-sessions" viewBox="0 0 24 24"><path d="M3 8V6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8Z"/><path d="M7 11h10m-10 4h6"/></symbol>
    <symbol id="icon-terminal" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="3"/><path d="m7.5 9 3 3-3 3m6 0h3"/></symbol>
    <symbol id="icon-mine" viewBox="0 0 24 24"><circle cx="12" cy="7.5" r="3.25"/><path d="M5 20v-1.5A4.5 4.5 0 0 1 9.5 14h5a4.5 4.5 0 0 1 4.5 4.5V20"/></symbol>
    <symbol id="icon-back" viewBox="0 0 24 24"><path d="m14.5 5.5-6.5 6.5 6.5 6.5"/></symbol>
    <symbol id="icon-next" viewBox="0 0 24 24"><path d="m9.5 5.5 6.5 6.5-6.5 6.5"/></symbol>
    <symbol id="icon-down" viewBox="0 0 24 24"><path d="m5.5 9.5 6.5 6.5 6.5-6.5"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="icon-send" viewBox="0 0 24 24"><path d="M5 19 19 5m-9 0h9v9"/></symbol>
    <symbol id="icon-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
    <symbol id="icon-select" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8 12 2.5 2.5L16 9"/></symbol>
    <symbol id="icon-pin" viewBox="0 0 24 24"><path d="m15.5 3 5.5 5.5-4 1.5-3 4v3l-1.5 1.5-7-7L7 10h3l4-3Zm-6 11.5L4 20"/></symbol>
    <symbol id="icon-key" viewBox="0 0 24 24"><circle cx="8" cy="10" r="4"/><path d="m11.2 12.6 6.3 6.4h2.5v-2.6l-1.6-1.6h-2v-2"/></symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2.5" fill="var(--wash)"/><circle cx="15" cy="17" r="2.5" fill="var(--wash)"/></symbol>
    <symbol id="icon-download" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M5 16v4h14v-4"/></symbol>
    <symbol id="icon-logout" viewBox="0 0 24 24"><path d="M11 4H5v16h6m2-8h8m-4-4 4 4-4 4"/></symbol>
  </svg>
  <main class="app" id="app" data-route="login">
    <header class="home-bar" id="home-bar" hidden>
      <button class="module-trigger" id="modules" type="button" aria-haspopup="dialog" aria-label="{{mainNavigation}}">
        <span class="brand-mark" aria-hidden="true"></span><b id="module-label">{{agents}}</b><svg class="glyph" aria-hidden="true"><use href="#icon-down"></use></svg>
      </button>
      <button class="machine-trigger" id="machine" type="button" aria-haspopup="dialog">
        <svg class="glyph" aria-hidden="true"><use href="#icon-machines"></use></svg><b id="scope"></b>
        <span class="machine-meta" id="health"></span><svg class="glyph chevron" aria-hidden="true"><use href="#icon-down"></use></svg>
      </button>
    </header>
    <div class="app-body">
      <div class="workspace" id="workspace" data-mobile-view="list" hidden>
        <section class="screen" id="list" aria-labelledby="list-heading">
          <header class="bar list-top">
            <h1 class="sr-only" id="list-heading" tabindex="-1">{{agents}}</h1>
            <div class="state-filters" id="state-filters" role="group" aria-label="{{agentStates}}"></div>
            <button class="primary" id="new-agent" type="button"><svg class="glyph" aria-hidden="true"><use href="#icon-plus"></use></svg>{{newAgent}}</button>
          </header>
          <div class="list-content">
            <div id="groups"></div>
          </div>
        </section>
        <section class="screen" id="detail" hidden>
          <header class="bar detail-bar">
            <button class="plain icon back" id="back" type="button" aria-label="{{backToAgents}}"><svg class="glyph" aria-hidden="true"><use href="#icon-back"></use></svg></button>
            <div class="detail-heading"><h2 id="detail-name" tabindex="-1"></h2><p id="detail-context"></p></div>
            <div class="chat-actions" id="chat-actions" hidden>
              <button class="plain icon" type="button" id="copy-selection" hidden>
                <svg class="glyph" aria-hidden="true"><use href="#icon-copy"></use></svg><span id="selection-count" aria-hidden="true"></span>
              </button>
              <button class="plain icon" type="button" id="select-messages" aria-label="{{selectMessages}}" title="{{selectMessages}}" aria-pressed="false">
                <svg class="glyph" aria-hidden="true"><use href="#icon-select"></use></svg>
              </button>
            </div>
            <button class="secondary" id="new-shell" type="button" hidden><svg class="glyph" aria-hidden="true"><use href="#icon-plus"></use></svg>{{newTerminal}}</button>
          </header>
          <div class="panel" id="chat" aria-label="{{conversation}}" hidden>
            <div class="history" id="history">
              <div class="history-progress" id="history-progress" role="status" hidden><span>{{loadingEarlierMessages}}</span></div>
              <div id="messages"></div>
            </div>
            <div class="composer-wrap">
              <div class="composer-inner">
                <p id="chat-error" class="message-error" role="status" hidden></p>
                <p class="composer-label" id="composer-label" role="status">
                  <span class="dot" aria-hidden="true"></span><span id="chat-status"></span>
                  <span class="working-dots" id="working-dots" aria-hidden="true" hidden><i></i><i></i><i></i></span>
                </p>
                <form class="composer" id="chat-form">
                  <textarea rows="1" id="chat-input" aria-label="{{messageAgent}}" placeholder="{{continueConversation}}"></textarea>
                  <button class="composer-send" type="submit" id="send" aria-label="{{send}}" title="{{send}}">
                    <svg class="glyph" aria-hidden="true"><use href="#icon-send"></use></svg>
                  </button>
                </form>
              </div>
            </div>
          </div>
          <div class="panel terminal-panel" id="term" aria-label="{{terminal}}" hidden>
            <div class="terminal">
              <div class="terminal-bar">
                <select id="terminal-pane" aria-label="{{sessionPanes}}"></select><span id="term-state" class="terminal-state">{{connecting}}</span>
                <button type="button" class="control" id="control" aria-pressed="false" disabled>{{enableInput}}</button>
              </div>
              <div class="terminal-screen" id="term-screen" aria-label="{{paneOutput}}"></div>
            </div>
            <div class="keys" role="group" aria-label="{{terminalShortcuts}}">
              <button type="button" data-key="Esc" disabled>Esc</button>
              <button type="button" data-key="Tab" disabled>Tab</button>
              <button type="button" data-key="Home" disabled>Home</button>
              <button type="button" data-key="↑" aria-label="{{arrowUp}}" disabled>↑</button>
              <button type="button" data-key="End" disabled>End</button>
              <button type="button" data-key="PageUp" aria-label="{{pageUp}}" disabled>PgUp</button>
              <button type="button" data-key="Ctrl" aria-pressed="false" disabled>Ctrl</button>
              <button type="button" data-key="Alt" aria-pressed="false" disabled>Alt</button>
              <button type="button" data-key="←" aria-label="{{arrowLeft}}" disabled>←</button>
              <button type="button" data-key="↓" aria-label="{{arrowDown}}" disabled>↓</button>
              <button type="button" data-key="→" aria-label="{{arrowRight}}" disabled>→</button>
              <button type="button" data-key="PageDown" aria-label="{{pageDown}}" disabled>PgDn</button>
            </div>
            <form class="term-entry" id="term-form" hidden>
              <input id="term-input" autocomplete="off" aria-label="{{terminalText}}" placeholder="{{terminalText}}">
              <button class="secondary" type="submit">{{enter}}</button>
            </form>
          </div>
          <div class="session-tree" id="session-tree" hidden></div>
          <div class="detail-empty" id="detail-empty" hidden></div>
        </section>
      </div>
      <section class="page" id="machines" aria-labelledby="machines-heading" hidden>
        <div class="page-content">
          <header class="page-head"><h1 id="machines-heading" tabindex="-1">{{machines}}</h1></header>
          <p class="machine-summary" id="machine-summary"></p>
          <div class="node-list" id="node-list"></div>
        </div>
      </section>
      <section class="page" id="mine" aria-labelledby="mine-heading" hidden>
        <div class="page-content">
          <header class="page-head">
            <button class="plain icon back" id="mine-back" type="button" aria-label="{{backToProfile}}" hidden><svg class="glyph" aria-hidden="true"><use href="#icon-back"></use></svg></button>
            <h1 id="mine-heading" tabindex="-1">{{profile}}</h1>
          </header>
          <div class="mine-grid" id="mine-home">
            <section class="usage" aria-labelledby="usage-heading">
              <div class="usage-head"><h2 id="usage-heading">{{usage}}</h2><span class="usage-provider">Codex</span></div>
              <div id="usage-windows"></div>
              <div class="quota-toolbar">
                <p class="quota-note" id="usage-note"></p>
                <button class="plain" type="button" id="usage-refresh">{{refresh}}</button>
              </div>
            </section>
            <div class="personal-links">
              <button class="profile-row" type="button" id="mine-passkeys"><span class="row-glyph"><svg class="glyph" aria-hidden="true"><use href="#icon-key"></use></svg></span><span class="row-copy"><b>{{passkeys}}</b><small>{{manageDevices}}</small></span><span class="trailing"><svg class="glyph" aria-hidden="true"><use href="#icon-next"></use></svg></span></button>
              <button class="profile-row" type="button" id="mine-preferences"><span class="row-glyph"><svg class="glyph" aria-hidden="true"><use href="#icon-settings"></use></svg></span><span class="row-copy"><b>{{settings}}</b><small>{{installAndSignIn}}</small></span><span class="trailing"><svg class="glyph" aria-hidden="true"><use href="#icon-next"></use></svg></span></button>
            </div>
          </div>
          <div class="subpage" id="mine-keys" hidden>
            <div id="key-list"></div>
            <div class="passkey-actions">
              <button class="primary" type="button" id="invite-device">{{setupAnotherDevice}}</button>
              <button class="secondary" type="button" id="add-key">{{addPasskey}}</button>
            </div>
          </div>
          <div class="subpage" id="mine-settings" hidden>
            <button class="profile-row" type="button" id="install"><span class="row-glyph"><svg class="glyph" aria-hidden="true"><use href="#icon-download"></use></svg></span><span class="row-copy"><b>{{install}}</b><small>{{openFromHomeScreen}}</small></span><span class="trailing"><svg class="glyph" aria-hidden="true"><use href="#icon-next"></use></svg></span></button>
            <button class="profile-row" type="button" id="signout"><span class="row-glyph"><svg class="glyph" aria-hidden="true"><use href="#icon-logout"></use></svg></span><span class="row-copy"><b>{{signOut}}</b><small>{{endBrowserSession}}</small></span><span class="trailing"><svg class="glyph" aria-hidden="true"><use href="#icon-next"></use></svg></span></button>
          </div>
        </div>
      </section>
      <section class="screen login" id="login">
        <div class="login-inner">
          <span class="brand"><span class="brand-mark" aria-hidden="true"></span>Workbench Web</span>
          <h1 id="login-heading" tabindex="-1">{{signInTitle}}</h1>
          <p>{{signInDescription}}</p>
          <p id="login-error" class="message-error" role="alert" hidden></p>
          <button class="primary" type="button" id="passkey">{{usePasskey}}</button>
          <button class="plain" type="button" id="enroll">{{firstDevice}}</button>
        </div>
      </section>
    </div>
    <dialog class="overlay" id="overlay" aria-labelledby="sheet-title">
      <section class="sheet">
        <header class="sheet-head">
          <h2 id="sheet-title"></h2>
          <button class="plain icon" type="button" id="close" aria-label="{{close}}" autofocus><svg class="glyph" aria-hidden="true"><use href="#icon-close"></use></svg></button>
        </header>
        <div id="sheet-body"></div>
      </section>
    </dialog>
    <div class="toast" id="toast" role="status" hidden></div>
    <div class="toast update-toast" id="update-toast" hidden>
      <span role="status">{{updateReady}}</span>
      <button type="button" class="update-refresh" id="update-refresh">{{reloadApp}}</button>
      <button type="button" class="update-dismiss" id="update-dismiss" aria-label="{{dismissUpdate}}" title="{{dismissUpdate}}">
        <svg class="glyph" aria-hidden="true"><use href="#icon-close"></use></svg>
      </button>
    </div>
  </main>

</body>
</html>
