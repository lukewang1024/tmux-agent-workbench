version = 1
min_engine_version = "2.0.0-alpha.3"
aliases = ["codex", "codex-cli"]

[[rules]]
id = "codex-automatic-approval-review"
priority = 1200
state = "working"
region = "codex_status"
visible = "working"
# The approval overlay can set Action Required even while its reviewer is busy.
matcher = { line_regex = { value = "(?i)^\\s*[•●⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏]?\\s*(automatically reviewing (the )?approval|reviewing approval request)([ .…(].*)?$" } }

[[rules]]
id = "codex-queued-question-idle"
priority = 1150
state = "idle"
region = "codex_status"
visible = "idle"
# A queued asynchronous question can keep Action Required in the title after
# the main turn ends. Require the queue UI and the idle composer together.
matcher = { all = { items = [
  { line_regex = { value = "^\\s*[•●]?\\s*Queued follow-up inputs\\s*$" } },
  { line_regex = { value = "^\\s*[?]\\s+[0-9]+ questions?\\s*$" } },
  { contains = { value = "to answer" } },
  { line_regex = { value = "^\\s*[›❯]\\s*$" } },
  { not = { item = { contains = { value = "esc to interrupt" } } } },
  { not = { item = { contains = { value = "Press enter to confirm" } } } }
] } }

[[rules]]
id = "codex-title-blocked"
priority = 1100
state = "blocked"
reason_category = "input"
region = "pane_title"
visible = "blocker"
matcher = { contains = { value = "Action Required" } }

[[rules]]
id = "codex-title-working"
priority = 1050
state = "working"
region = "pane_title"
visible = "working"
matcher = { regex = { value = "(?:^| )[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏](?: |$)" } }

[[rules]]
id = "codex-empty-screen-idle"
priority = 10
state = "idle"
region = "whole_recent"
visible = "idle"
matcher = { regex = { value = "^\\s*$" } }

[[rules]]
id = "codex-approval"
priority = 1180
state = "blocked"
reason_category = "approval"
region = "codex_status"
visible = "blocker"
matcher = { any = { items = [
  { line_regex = { value = "(?i)^\\s*(would you like|do you want) .*[?]\\s*$" } },
  { line_regex = { value = "(?i)^\\s*(allow|approve) .*[?]\\s*$" } }
] } }

[[rules]]
id = "codex-resource-limit"
priority = 1170
state = "blocked"
reason_category = "resource_limit"
region = "codex_status"
visible = "blocker"
matcher = { line_regex = { value = "(?i)^\\s*(usage limit|rate limit|you have .* weighted tokens left)" } }

[[rules]]
id = "codex-idle-with-background-terminal"
priority = 260
state = "idle"
region = "codex_status"
visible = "idle"
matcher = { all = { items = [
  { contains = { value = "background terminal running" } },
  { line_regex = { value = "^\\s*[›❯](\\s+.*)?\\s*$" } }
] } }

[[rules]]
id = "codex-working-interruptible"
priority = 1140
state = "working"
region = "codex_status"
visible = "working"
matcher = { contains = { value = "esc to interrupt" } }

[[rules]]
id = "codex-title-idle"
priority = 100
state = "idle"
region = "pane_title"
# A missing spinner is only negative evidence: Codex briefly clears/reorders its
# title during a live turn. Keep this weak so working -> idle still goes through
# the directed three-sample stabilization instead of emitting a false done.
visible = "always"
matcher = { all = { items = [
  { regex = { value = "\\S" } },
  { not = { item = { regex = { value = "(?:^| )[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏](?: |$)" } } } },
  { not = { item = { contains = { value = "Action Required" } } } }
] } }

[[rules]]
id = "codex-working"
priority = 200
state = "working"
region = "codex_status"
visible = "working"
matcher = { line_regex = { value = "(?i)^\\s*[•●◐◓◑◒].*(working|thinking|running|searching|analyzing)" } }

[[rules]]
id = "codex-idle-prompt"
priority = 220
state = "idle"
region = "codex_status"
visible = "idle"
matcher = { all = { items = [
  { line_regex = { value = "^\\s*[›❯](\\s+.*|[⠁-⣿]*Ask Codex to do anything.*)?\\s*$" } },
  { not = { item = { line_regex = { value = "^\\s*Select Model and Effort\\s*$" } } } }
] } }
