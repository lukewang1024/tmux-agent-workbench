[package]
name = "tmux-agent-workbench"
version = "2.0.0-beta.4"
edition = "2024"
license = "MIT"
description = "Local tmux agent discovery and attention system"
repository = "https://github.com/lukewang1024/tmux-agent-workbench"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
dirs = "6.0"
fs2 = "0.4"
libc = "0.2"
regex = "1.11"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
sha2 = "0.10"
sysinfo = "0.37"
thiserror = "2.0"
toml = "0.9"
toml_edit = "0.23"
uuid = { version = "1.18", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.21"

[profile.release]
strip = true
lto = true
codegen-units = 1
