name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci_gate:
    name: CI gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install P0 test dependencies
        run: |
          if timeout 8 getent ahostsv4 azure.archive.ubuntu.com >/dev/null 2>&1 &&
             timeout 8 getent ahostsv4 archive.ubuntu.com >/dev/null 2>&1 &&
             timeout 8 getent ahostsv4 security.ubuntu.com >/dev/null 2>&1 &&
             sudo apt-get -o Acquire::Retries=0 -o Acquire::https::Timeout=15 update -qq &&
             sudo apt-get -o Acquire::Retries=0 -o Acquire::https::Timeout=15 install -y tmux; then
            :
          else
            echo 'Ubuntu default archives unavailable; trying a signed mirror'
            workbench_sources="$RUNNER_TEMP/workbench-ubuntu.sources.list"
            for workbench_suite in noble noble-updates noble-backports noble-security; do
              printf 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://mirrors.edge.kernel.org/ubuntu %s main universe\n' "$workbench_suite"
            done > "$workbench_sources"
            sudo apt-get -o Dir::Etc::sourcelist="$workbench_sources" -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0 -o Acquire::Retries=1 -o Acquire::https::Timeout=20 update -qq
            sudo apt-get -o Dir::Etc::sourcelist="$workbench_sources" -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0 -o Acquire::Retries=1 -o Acquire::https::Timeout=20 install -y tmux
          fi
      - run: sh tests/p0.sh

  extended:
    name: P1 full suite (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install test dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          if timeout 8 getent ahostsv4 azure.archive.ubuntu.com >/dev/null 2>&1 &&
             timeout 8 getent ahostsv4 archive.ubuntu.com >/dev/null 2>&1 &&
             timeout 8 getent ahostsv4 security.ubuntu.com >/dev/null 2>&1 &&
             sudo apt-get -o Acquire::Retries=0 -o Acquire::https::Timeout=15 update &&
             sudo apt-get -o Acquire::Retries=0 -o Acquire::https::Timeout=15 install -y fzf libevent-dev libncurses-dev bison pkg-config; then
            :
          else
            echo 'Ubuntu default archives unavailable; trying a signed mirror'
            workbench_sources="$RUNNER_TEMP/workbench-ubuntu.sources.list"
            for workbench_suite in noble noble-updates noble-backports noble-security; do
              printf 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://mirrors.edge.kernel.org/ubuntu %s main universe\n' "$workbench_suite"
            done > "$workbench_sources"
            sudo apt-get -o Dir::Etc::sourcelist="$workbench_sources" -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0 -o Acquire::Retries=1 -o Acquire::https::Timeout=20 update
            sudo apt-get -o Dir::Etc::sourcelist="$workbench_sources" -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0 -o Acquire::Retries=1 -o Acquire::https::Timeout=20 install -y fzf libevent-dev libncurses-dev bison pkg-config
          fi
          sh .github/scripts/install-ci-tmux.sh
      - name: Install test dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install fzf libevent ncurses bison pkgconf utf8proc jemalloc
          sh .github/scripts/install-ci-tmux.sh
      - run: sh tests/verify.sh
      - name: Use the iSH-validated compiler
        if: runner.os == 'Linux'
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: i586-unknown-linux-musl
      - name: Verify the static iSH build
        if: runner.os == 'Linux'
        run: |
          export CARGO_TARGET_I586_UNKNOWN_LINUX_MUSL_LINKER="$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/rust-lld"
          cargo test --locked --target i586-unknown-linux-musl
  intel_title_hooks:
    name: Title hooks (macos-15-intel)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install test dependencies
        run: brew install tmux
      - run: cargo test --locked --lib task_title::tests
      - run: cargo build --locked --bin tmux-agent-workbench --example codex
      - run: sh tests/python.sh tests/task-titles.py target/debug/tmux-agent-workbench target/debug/examples/codex
