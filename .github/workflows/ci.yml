name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install test dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fzf libevent-dev libncurses-dev bison pkg-config
          sh .github/scripts/install-ci-tmux.sh
      - name: Install test dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install fzf libevent ncurses bison pkgconf utf8proc
          sh .github/scripts/install-ci-tmux.sh
      - run: sh tests/verify.sh
      - name: Verify the static iSH build
        if: runner.os == 'Linux'
        run: |
          rustup target add i586-unknown-linux-musl
          export CARGO_TARGET_I586_UNKNOWN_LINUX_MUSL_LINKER="$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/rust-lld"
          cargo test --locked --target i586-unknown-linux-musl
  intel_title_hooks:
    name: Title hooks (macos-15-intel)
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install test dependencies
        run: brew install tmux
      - run: cargo test --locked --lib task_title::tests
      - run: cargo build --locked --bin tmux-agent-workbench --example codex
      - run: sh tests/python.sh tests/task-titles.py target/debug/tmux-agent-workbench target/debug/examples/codex
  required:
    name: CI gate
    if: always()
    needs: [verify, intel_title_hooks]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all platforms to pass
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          INTEL_RESULT: ${{ needs.intel_title_hooks.result }}
        run: |
          test "$VERIFY_RESULT" = success
          test "$INTEL_RESULT" = success
