name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install test dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fzf libevent-dev libncurses-dev bison pkg-config
          sh .github/scripts/install-ci-tmux.sh
      - name: Install test dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux fzf
      - run: sh tests/verify.sh
  required:
    name: CI gate
    if: always()
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - name: Require all platforms to pass
        env:
          RESULT: ${{ needs.verify.result }}
        run: test "$RESULT" = success
