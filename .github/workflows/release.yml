name: release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      repair_release_tag:
        description: 'Rebuild an existing immutable tag using CI-validated test tooling'
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.prepare.outputs.enabled }}
      tag: ${{ steps.prepare.outputs.tag }}
      source: ${{ steps.prepare.outputs.source }}
      validation: ${{ steps.prepare.outputs.validation }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_RELEASE_TAG: ${{ inputs.repair_release_tag }}
        run: python3 .github/scripts/prepare-release.py
  build:
    needs: prepare
    if: needs.prepare.outputs.enabled == 'true'
    # Intel macOS runs the full tmux suite and a release build on slower hosts.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
            android: false
          - os: macos-15
            target: aarch64-apple-darwin
            android: false
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            android: false
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            android: false
          - os: ubuntu-24.04
            target: i586-unknown-linux-musl
            android: false
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            android: false
          - os: ubuntu-24.04
            target: aarch64-linux-android
            android: true
            android_linker: aarch64-linux-android24-clang
          - os: ubuntu-24.04
            target: x86_64-linux-android
            android: true
            android_linker: x86_64-linux-android24-clang
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source }}
          fetch-depth: 0
      - name: Use the validated installer test fixture
        env:
          VALIDATION_REF: ${{ needs.prepare.outputs.validation }}
        run: git show "$VALIDATION_REF:tests/core-selection.sh" > tests/core-selection.sh
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.target != 'i586-unknown-linux-musl'
        with:
          targets: ${{ matrix.target }}
      - name: Use the iSH-validated compiler
        if: matrix.target == 'i586-unknown-linux-musl'
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: i586-unknown-linux-musl
      - name: Install runtime test dependencies (Linux)
        if: runner.os == 'Linux' && !matrix.android
        run: |
          case "$(dpkg --print-architecture)" in
            amd64)
              workbench_primary_host=archive.ubuntu.com
              workbench_archive=https://mirrors.edge.kernel.org/ubuntu
              ;;
            arm64)
              workbench_primary_host=ports.ubuntu.com
              workbench_archive=https://mirrors.mit.edu/ubuntu-ports
              ;;
            *) echo 'Unsupported Ubuntu runner architecture' >&2; exit 1 ;;
          esac
          if timeout 8 getent ahostsv4 "$workbench_primary_host" >/dev/null 2>&1 &&
             sudo apt-get -o Acquire::Retries=0 -o Acquire::https::Timeout=15 update &&
             sudo apt-get -o Acquire::Retries=0 -o Acquire::https::Timeout=15 install -y fzf musl-tools libevent-dev libncurses-dev bison pkg-config; then
            :
          else
            echo 'Ubuntu default archives unavailable; trying a signed mirror'
            workbench_sources="$RUNNER_TEMP/workbench-ubuntu.sources.list"
            for workbench_suite in noble noble-updates noble-backports noble-security; do
              printf 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] %s %s main universe\n' "$workbench_archive" "$workbench_suite"
            done > "$workbench_sources"
            sudo apt-get -o Dir::Etc::sourcelist="$workbench_sources" -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0 -o Acquire::Retries=1 -o Acquire::https::Timeout=20 update
            sudo apt-get -o Dir::Etc::sourcelist="$workbench_sources" -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0 -o Acquire::Retries=1 -o Acquire::https::Timeout=20 install -y fzf musl-tools libevent-dev libncurses-dev bison pkg-config
          fi
          sh .github/scripts/install-ci-tmux.sh
      - name: Install runtime test dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install fzf libevent ncurses bison pkgconf utf8proc jemalloc
          sh .github/scripts/install-ci-tmux.sh
      - name: Configure Android NDK linker
        if: matrix.android
        run: |
          mkdir -p .cargo
          printf '[target.%s]\nlinker = "%s/toolchains/llvm/prebuilt/linux-x86_64/bin/%s"\n' \
            '${{ matrix.target }}' "$ANDROID_NDK_LATEST_HOME" '${{ matrix.android_linker }}' \
            > .cargo/config.toml
      - name: Configure the static iSH linker
        if: matrix.target == 'i586-unknown-linux-musl'
        run: echo "CARGO_TARGET_I586_UNKNOWN_LINUX_MUSL_LINKER=$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/rust-lld" >> "$GITHUB_ENV"
      - run: cargo test --locked --target "${{ matrix.target }}"
        if: '!matrix.android'
      - run: tests/integration-tmux.sh
        if: runner.os == 'macOS'
      - run: tests/relay-pairing.sh
        if: '!matrix.android'
      - run: tests/install.sh
        if: '!matrix.android'
      - run: cargo build --locked --release --target "${{ matrix.target }}"
      - name: Package
        run: |
          mkdir -p dist/docs
          cp "target/${{ matrix.target }}/release/tmux-agent-workbench" dist/
          cp README.md LICENSE dist/
          cp -R LICENSES dist/
          cp docs/assistant-sessions.md dist/docs/
          tar -C dist -czf "tmux-agent-workbench-${{ matrix.target }}.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: rust-${{ matrix.target }}
          path: tmux-agent-workbench-${{ matrix.target }}.tar.gz
          if-no-files-found: error
  windows-companion:
    needs: prepare
    if: needs.prepare.outputs.enabled == 'true'
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - runtime: win-x64
            runner: windows-2025
          - runtime: win-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet publish windows-companion/wb-client.csproj -c Release -r ${{ matrix.runtime }} --self-contained true -p:PublishSingleFile=true
      - shell: pwsh
        run: |
          $archive = "wb-client-${{ matrix.runtime }}.zip"
          Compress-Archive -Path "windows-companion/bin/Release/net9.0-windows10.0.19041.0/${{ matrix.runtime }}/publish/*" -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -Encoding ascii "$archive.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.runtime }}
          path: |
            wb-client-${{ matrix.runtime }}.zip
            wb-client-${{ matrix.runtime }}.zip.sha256
          if-no-files-found: error
  publish:
    needs: [prepare, build, windows-companion]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish only after every target succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          test "$(find dist -type f | wc -l)" -eq 12
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          case "$RELEASE_TAG" in
            *-*) gh release edit "$RELEASE_TAG" --draft=false --prerelease ;;
            *)   gh release edit "$RELEASE_TAG" --draft=false --latest ;;
          esac
